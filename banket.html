<!DOCTYPE html>
<html>
<head>
    <title>Зоренька</title>
    <style>
         button {
        padding: 14px 16px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        color: #1a1a1a;
        background-color: #ff9900; /* небесноголубой background-color: #ff9900;  облепиховый цвет */
        transition: background-color 0.2s, transform 0.1s;
      } 
      .buttons-container {
        display: flex;
        flex-direction: column;       /* КНОПКИ В СТОЛБИК */
        gap: 12px;                    /* Расстояние между кнопками */
        max-width: 320px;             /* Чтобы не растягивалось на весь экран */
        margin: 0 auto;               /* По центру страницы */
      }
    </style>
</head>
<body>

    <!-- Кнопки управления -->
    <button onclick="showPdf()">Банкетное меню</button>
    <a href="https://disk.yandex.ru/i/K9oaHJouhZM96w" download target="_blank" rel="noopener">Открыть банкетное меню</a>
    <button>Зал торжеств</button>
    <button>Назад</button>

    <!-- Контейнер для PDF -->
    <div class="pdf-container" id="pdfContainer">
        <iframe id="pdfViewer" src="" width="100%" height="600px" frameborder="0"></iframe>
        <button onclick="hidePdf()">Закрыть</button>
    </div>

    <script>
        function showPdf() {
            // Укажите правильный путь к файлу
            const pdfPath = 'https://disk.yandex.ru/i/K9oaHJouhZM96w?download=1' // путь к файлу на вашем сервере
            
            document.getElementById('pdfContainer').style.display = 'block';
            document.getElementById('pdfViewer').src = pdfPath;
        }

        function hidePdf() {
            document.getElementById('pdfContainer').style.display = 'none';
        }
    </script>
</body>
</html>
