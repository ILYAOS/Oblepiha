<!DOCTYPE html>
<html>
<head>
    <title>Зоренька</title>
    <style>
        button {
            margin: 10px;
            padding: 15px 25px;
            font-size: 16px;
            cursor: pointer;
        }
        .pdf-container {
            display: none;
            border: 1px solid #ddd;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Кнопки управления -->
    <button onclick="downloadAndShowPDF()">Банкетное меню</button>
    <button>Зал торжеств</button>
    <button>Назад</button>

    <!-- Контейнер для PDF -->
    <div class="pdf-container" id="pdfContainer">
        <iframe id="pdfViewer" src="" width="100%" height="600px" frameborder="0"></iframe>
        <button onclick="hidePdf()">Закрыть</button>
    </div>

    <script>
        // Функция для скачивания и показа PDF
        async function downloadAndShowPDF() {
            const yandexFileUrl = 'https://disk.yandex.ru/i/K9oaHJouhZM96w'; // замените на ваш ID файла
            const downloadUrl = yandexFileUrl + '?download=1';
            
            try {
                // Сначала скачиваем файл
                const response = await fetch(downloadUrl);
                if (!response.ok) {
                    throw new Error('Ошибка при загрузке файла');
                }
                
                // Создаем Blob из ответа
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                // Показываем PDF
                document.getElementById('pdfContainer').style.display = 'block';
                document.getElementById('pdfViewer').src = url;
            } catch (error) {
                alert('Не удалось загрузить файл. Попробуйте скачать его вручную.');
                window.open(downloadUrl, '_blank');
            }
        }

        function hidePdf() {
            document.getElementById('pdfContainer').style.display = 'none';
        }
    </script>
</body>
</html>
