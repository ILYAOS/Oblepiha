<!DOCTYPE html>
<html>
<head>
    <title>Зоренька</title>
    <style>
        button {
            margin: 10px;
            padding: 15px 25px;
            font-size: 16px;
            cursor: pointer;
        }
        .pdf-container {
            display: none;
            border: 1px solid #ddd;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Кнопки управления -->
    <button onclick="showPdf()">Банкетное меню</button>
    <a href="https://disk.yandex.ru/i/K9oaHJouhZM96w" target="_blank" rel="noopener">Открыть банкетное меню</a>
    <button>Зал торжеств</button>
    <button>Назад</button>

    <!-- Контейнер для PDF -->
    <div class="pdf-container" id="pdfContainer">
        <iframe id="pdfViewer" src="" width="100%" height="600px" frameborder="0"></iframe>
        <button onclick="hidePdf()">Закрыть</button>
    </div>

    <script>
        function showPdf() {
            // Укажите правильный путь к файлу
            const pdfPath = 'https://disk.yandex.ru/i/K9oaHJouhZM96w?download=1' // путь к файлу на вашем сервере
            
            document.getElementById('pdfContainer').style.display = 'block';
            document.getElementById('pdfViewer').src = pdfPath;
        }

        function hidePdf() {
            document.getElementById('pdfContainer').style.display = 'none';
        }
    </script>
</body>
</html>
