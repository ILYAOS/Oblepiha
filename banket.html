<!DOCTYPE html>
<html>
<head>
    <title>Банкетный зал</title>
    <style>
        button {
            margin: 10px;
            padding: 15px 25px;
            font-size: 16px;
            cursor: pointer;
        }
        .pdf-container {
            display: none;
            border: 1px solid #ddd;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Кнопки управления -->
    <button onclick="showPdf()">Банкетное меню</button>
    <button>Зал торжеств</button>
    <button>Назад</button>

    <!-- Контейнер для PDF -->
    <div class="pdf-container" id="pdfContainer">
        <iframe id="pdfViewer" src="" width="100%" height="600px" frameborder="0"></iframe>
        <button onclick="hidePdf()">Закрыть</button>
    </div>

    <script>
        function showPdf() {
            // Показываем контейнер с PDF
            document.getElementById('pdfContainer').style.display = 'block';
            
            // Загружаем PDF файл
            document.getElementById('pdfViewer').src = 'https://disk.yandex.ru/i/K9oaHJouhZM96w';
        }

        function hidePdf() {
            // Скрываем контейнер
            document.getElementById('pdfContainer').style.display = 'none';
        }
    </script>
</body>
</html>
