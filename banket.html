<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Зоренька — Таблица событий</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        
        th {
            background-color: #f2f2f2;
        }
         button {
        padding: 14px 16px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        color: #1a1a1a;
        background-color: #ff9900; /* небесноголубой background-color: #ff9900;  облепиховый цвет */
        transition: background-color 0.2s, transform 0.1s;
      } 
      .buttons-container {
        display: flex;
        flex-direction: column;       /* КНОПКИ В СТОЛБИК */
        gap: 12px;                    /* Расстояние между кнопками */
        max-width: 320px;             /* Чтобы не растягивалось на весь экран */
        margin: 0 auto;               /* По центру страницы */
      }
    </style>
</head>
<body>
    <div class="buttons-container">
         <button onclick="window.location.href = 'https://disk.yandex.ru/i/K9oaHJouhZM96w'">Банкетное меню</button>
         <button onclick="window.location.href = 'https://disk.yandex.ru/i/Z71B9jE2O09nRg'">Зал торжеств</button>
         <button onclick="window.location.href = 'index.html'">Назад</button>
         <button onclick="downloadPDF()">
             <iframe src="https://disk.yandex.ru/i/Z71B9jE2O09nRg" width="800" height="450" frameborder="0" allowfullscreen></iframe>
    Банкетное меню222
</button>
    </div>
   


<script>
function downloadPDF() {
    // Создаем элемент ссылки
    const a = document.createElement('a');
    a.href = 'https://disk.yandex.ru/i/K9oaHJouhZM96w?download=1';
    a.setAttribute('download', 'банкетное_меню.pdf');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}
</script>
    
</body>
</html>
